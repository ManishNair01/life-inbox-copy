<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Life Inbox</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="wrap">
    <h1>Life Inbox</h1>
    <p class="sub">Capture first. Organize the whole inbox with AI when you are ready.</p>

    <textarea id="noteText" placeholder="Example: Met Rohan yesterday. He recommended Atomic Habits. Need to order it this weekend. Also ask him about that Gurgaon restaurant."></textarea>
    <br />
    <button id="addNoteButton" type="button" onclick="addNote()">Add Note</button>
    <button id="analyzeButton" type="button" class="secondary" onclick="analyzeInbox()">Analyze Entire Inbox with AI</button>
    <p id="noteStatus" class="status muted" role="status" aria-live="polite"></p>

    <h2>AI-organized inbox</h2>
    <p id="analysisStatus" class="status muted" role="status" aria-live="polite"></p>
    <div id="aiOutput" class="panel">
      <span class="muted">Save a few notes, then click “Analyze Entire Inbox with AI”.</span>
    </div>

    <h2>Tasks</h2>
    <div class="task-toolbar">
      <label for="taskStatusFilter">Show</label>
      <select id="taskStatusFilter" onchange="changeTaskStatusFilter()">
        <option value="open">Open</option>
        <option value="completed">Completed</option>
        <option value="dismissed">Dismissed</option>
      </select>
    </div>
    <p id="taskStatus" class="status muted" role="status" aria-live="polite"></p>
    <div id="tasks"></div>

    <h2>Raw saved notes</h2>
    <form id="itemSearchForm" class="search-toolbar" onsubmit="applyItemFilters(event)">
      <label>
        Search
        <input id="itemSearch" type="search" maxlength="200" placeholder="Text or title" />
      </label>
      <label>
        Type
        <select id="itemTypeFilter">
          <option value="">All</option>
          <option value="text">Text</option>
        </select>
      </label>
      <label>
        Category
        <select id="categoryFilter">
          <option value="">All</option>
        </select>
      </label>
      <label>
        Priority
        <select id="priorityFilter">
          <option value="">All</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
      </label>
      <label>
        Processing
        <select id="processingStatusFilter">
          <option value="">All</option>
          <option value="ready">Ready</option>
        </select>
      </label>
      <div class="search-actions">
        <button type="submit">Search</button>
        <button type="button" class="secondary" onclick="clearItemFilters()">Clear</button>
      </div>
    </form>
    <p id="searchStatus" class="status muted" role="status" aria-live="polite"></p>
    <div id="notes"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
